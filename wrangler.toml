name = "telegram-voice-bot"
main = "src/index.ts"
account_id = "e8089d9d52981bec1da4c60c7a027b57"  # personal account (Saman.ghadirian@gmail.com)
compatibility_date = "2024-01-01"

# Compatibility flags for better Node.js compatibility
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
ALLOWED_USERS = "Sam4nFox,irgamedevelop,ShabnamShirzadegan"  # Comma-separated list of allowed usernames or chat IDs

# Defaults for every chat; each chat can change its own with /settings in Telegram.
# Change a default here, then deploy. List the models your key can use:
#   curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY"
TRANSCRIBE_MODEL = "gpt-transcribe"  # speech-to-text: gpt-transcribe, gpt-4o-transcribe, gpt-4o-mini-transcribe, whisper-1
LANGUAGE = "auto"                    # spoken language: auto, or an ISO-639-1 code such as fa or en
OUTPUT_MODE = "transcript"           # transcript, polished, or both
POLISH_MODEL = "gpt-6.2-sol"         # text model for the polished version (unused when OUTPUT_MODE is transcript)

[[kv_namespaces]]
binding = "SESSIONS"
id = "fac198f4148145a898480d1813368e18"

# Queue Producer Configuration (sends jobs to queue)
[[queues.producers]]
queue = "voice-processing-queue"
binding = "VOICE_QUEUE"

# Queue Consumer Configuration (processes jobs asynchronously)
[[queues.consumers]]
queue = "voice-processing-queue"
max_batch_size = 1           # Process one job at a time
max_batch_timeout = 1        # Start processing immediately (seconds)
max_retries = 3              # Retry failed jobs 3 times
dead_letter_queue = "voice-processing-dlq"  # Failed jobs go here

# Dead Letter Queue for permanently failed jobs
[[queues.producers]]
queue = "voice-processing-dlq"
binding = "VOICE_DLQ"

# Secrets (set with: wrangler secret put SECRET_NAME)
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put OPENAI_API_KEY

# Setup commands (run before first deploy):
# wrangler queues create voice-processing-queue
# wrangler queues create voice-processing-dlq
# wrangler types  # Generate TypeScript types
